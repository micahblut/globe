<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Globe Tracker — World Travel Progress</title>
<link rel="stylesheet" href="css/styles.css" />
</head>
<body>
<div id="stage">
  <div id="loading">Loading world data…</div>
  <div id="hint">Drag to rotate · Scroll to zoom</div>
  <div id="tooltip"></div>

  <div id="controls">
    <button id="zoom-in" title="Zoom in">+</button>
    <button id="zoom-out" title="Zoom out">–</button>
  </div>

  <button
    id="dart-mode-btn"
    title="Dart Mode: spin the globe and land on a random unwatched country"
    aria-label="Dart Mode: spin the globe and land on a random unwatched country"
    disabled
  >🎯</button>

  <div id="panel">
    <h1 id="panel-title">Globe Tracker</h1>
    <p id="progress-line">Places Visited: <span id="progress-count">0 / 0</span></p>
    <div id="panel-actions">
      <button id="export-btn">Export Progress</button>
      <button id="import-btn">Import Progress</button>
      <input type="file" id="import-input" accept="application/json,.json" hidden />
    </div>
    <p id="panel-help">Click a country or region to mark it visited.</p>
  </div>

  <aside id="place-drawer" class="hidden" aria-hidden="true">
    <div id="drawer-header">
      <h2 id="drawer-title"></h2>
      <button id="drawer-close" title="Close" aria-label="Close notes">&times;</button>
    </div>
    <label id="drawer-notes-label" for="drawer-notes">Notes</label>
    <div
      id="drawer-notes-view"
      tabindex="0"
      role="button"
      aria-label="Edit notes"
      aria-labelledby="drawer-notes-label"
    ></div>
    <textarea
      id="drawer-notes"
      placeholder="Notes about this place... paste a link or use [label](https://example.com)"
      hidden
    ></textarea>
    <p id="drawer-hint">Notes save automatically and are included in Export/Import.</p>
  </aside>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="data/countries-110m.js"></script>
<script src="data/country-regions.js"></script>
<script src="js/storage.js"></script>
<script src="js/globe.js"></script>
<script src="js/regions.js"></script>
<script src="js/notes-drawer.js"></script>
<script src="js/main.js"></script>
</body>
</html>
